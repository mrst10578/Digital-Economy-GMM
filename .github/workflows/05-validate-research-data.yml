name: Validate imported research dataset and build Stata DTA
on:
  push:
    paths:
      - ".github/workflows/05-validate-research-data.yml"
      - "data/raw/**"
      - "src/python/**"
      - "config/project.json"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install IO and audit libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" "openpyxl>=3.1,<4"
      - name: Audit source workbook (real data, not GMM)
        run: python -m src.python.preflight
      - name: Build Stata-compatible DTA from real data
        run: python -m src.python.to_stata
      - name: Upload checked data artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audited-data-and-stata-input
          path: |
            outputs/preflight_status.json
            data/processed/stata_ready.dta
          if-no-files-found: warn
