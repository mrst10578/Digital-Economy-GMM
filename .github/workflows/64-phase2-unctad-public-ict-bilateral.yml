name: Phase 2 test keyless official UNCTAD pre-aggregated ICT bilateral dataset access
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - 'src/python/extended/probe_unctad_ict_bilateral_public_export.py'
      - '.github/workflows/64-phase2-unctad-public-ict-bilateral.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight-no-secret-and-no-bulk-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe only 16KB samples and official UNCTAD ICT report metadata, without any subscription token
        run: python src/python/extended/probe_unctad_ict_bilateral_public_export.py
      - name: Commit observed API status evidence only
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/extended/UNCTAD_ICT_BILATERAL_PUBLIC_EXPORT_PREFLIGHT_2026-10-17.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): archive UNCTAD harmonized bilateral ICT public export access verdict"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
