name: Digital economy real data audit and OLS-FE benchmarks
on:
  push:
    paths:
      - ".github/workflows/07-python-research.yml"
      - "src/python/analysis.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-python-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-python.txt matplotlib
      - name: Execute data provenance audit and two-model pooled-FE benchmarks
        run: python -u -m src.python.analysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-python-real-analysis
          path: |
            outputs/python/
            data/processed/stata_ready.dta
            data/processed/panel_for_models.csv
          if-no-files-found: warn
