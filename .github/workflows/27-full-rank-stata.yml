name: Verify fixed GMM numerical rank and archived native Stata run
on:
  push:
    branches:
      - research/digital-economy-estimation-audit-20261008
    paths:
      - 'stata/01_environment_and_data.do'
      - 'stata/03_growth_models.do'
      - 'stata/04_productivity_models.do'
      - 'src/python/audit_full_rank_gmm.py'
      - 'evidence/tablet-stata-2026-10-15/full_rank_*'
      - 'evidence/tablet-stata-2026-10-15/production_full_rank_*'
      - '.github/workflows/27-full-rank-stata.yml'
  pull_request:
    paths:
      - 'stata/01_environment_and_data.do'
      - 'stata/03_growth_models.do'
      - 'stata/04_productivity_models.do'
      - 'src/python/audit_full_rank_gmm.py'
      - 'evidence/tablet-stata-2026-10-15/full_rank_*'
      - 'evidence/tablet-stata-2026-10-15/production_full_rank_*'
      - '.github/workflows/27-full-rank-stata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-stata-full-rank-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all six native Stata fits and historic diagnostic equivalence
        run: python -m src.python.audit_full_rank_gmm
      - name: Archive machine-readable proof (does NOT run Stata)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-stata-full-rank-evidence-audit
          path: outputs/full_rank_audit/latest.json
          if-no-files-found: warn
