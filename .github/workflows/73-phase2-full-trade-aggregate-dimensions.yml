name: Phase 2 audit Comtrade full API overlapping world aggregate dimensions
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - '.github/workflows/73-phase2-full-trade-aggregate-dimensions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-world-record-granularity:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit all available World record dimensions and compare six limited requests
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          test -n "$COMTRADE_API_KEY"
          python src/python/extended/diagnose_comtrade_full_aggregation_dimensions.py
      - name: Commit sanitized dimension-level evidence not modeled data
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/extended/COMTRADE_HS_AS_REPORTED_WORLD_GRANULARITY_DIAG_2026-10-17.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): audit Comtrade HS full world partner aggregation and customs flags"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
