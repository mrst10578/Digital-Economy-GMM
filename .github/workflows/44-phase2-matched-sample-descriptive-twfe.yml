name: Phase 2 matched-sample exploratory FDI and ICT imports TWFE
on:
  push:
    branches:
      - research/digital-economy-extended-data
    paths:
      - 'src/python/extended/pilot_wdi_coverage.py'
      - 'src/python/extended/twfe_same_sample_fdi_ict_imports.py'
      - 'config/extended/phase2_original_47_country_sample_lock.json'
      - '.github/workflows/44-phase2-matched-sample-descriptive-twfe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descriptive-4-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned econometrics and workbook dependencies
        run: python -m pip install 'openpyxl>=3.1,<4' 'linearmodels>=6,<8' 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Verify original source and fetch Phase-B-only WDI snapshots
        run: python src/python/extended/pilot_wdi_coverage.py
      - name: Run four noncausal two-way FE models with identical 840-row country-year keys
        run: python src/python/extended/twfe_same_sample_fdi_ict_imports.py
      - name: Confirm sample and show digital coefficient changes, not significance selection
        run: |
          cat outputs/extended/wdi_pilot_2026_10_16/twfe_comparison/twfe_digital_coefficient_comparison.csv
          echo "----- Complete 28-coefficient audit, including FDI and ICT import controls -----"
          cat outputs/extended/wdi_pilot_2026_10_16/twfe_comparison/twfe_all_coefficients.csv
          echo "Do not read this TWFE experiment as professor's System GMM or causal evidence."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-EXPERIMENTAL-four-matched-840-TWFE-models-noncausal
          path: outputs/extended/wdi_pilot_2026_10_16/
          if-no-files-found: warn
          retention-days: 30
