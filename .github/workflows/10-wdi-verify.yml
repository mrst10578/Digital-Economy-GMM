name: Digital economy independent WDI source check
on:
  push:
    paths:
      - ".github/workflows/10-wdi-verify.yml"
      - "src/python/verify_wdi.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wdi-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "pandas>=2.1,<3" "openpyxl>=3.1,<4"
      - name: Compare every source observation to present-day WDI API when accessible
        run: python -u -m src.python.verify_wdi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-wdi-provenance-current
          path: outputs/wdi/
          if-no-files-found: warn
