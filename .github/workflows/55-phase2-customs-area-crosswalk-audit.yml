name: Phase 2 research QA for Comtrade customs areas vs ISO-country mapping
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - 'src/python/extended/audit_comtrade_customs_area_country_codes.py'
      - '.github/workflows/55-phase2-customs-area-crosswalk-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crosswalk-sensitivity-no-external-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare nine source reporters against Comtrade official customs-area country codes
        run: python src/python/extended/audit_comtrade_customs_area_country_codes.py
      - name: Commit descriptive audit only, no recoded raw source or FTECH proxy
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extended/comtrade/CUSTOMS_AREA_CROSSWALK_AUDIT_2026-10-17.csv
          git add data/extended/comtrade/CUSTOMS_AREA_CROSSWALK_AUDIT_2026-10-17.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): quantify country-code mismatch across nine trade reporters"
            git push origin HEAD:research/digital-economy-extended-data
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-customs-area-crosswalk-sensitivity-exact-versus-proxy
          path: data/extended/comtrade/CUSTOMS_AREA_CROSSWALK_AUDIT_2026-10-17.*
          if-no-files-found: warn
          retention-days: 30
