name: Phase 2 joint WDI panel coverage (no model)
on:
  push:
    branches:
      - research/digital-economy-extended-data
    paths:
      - 'src/python/extended/pilot_wdi_coverage.py'
      - 'src/python/extended/audit_joint_coverage.py'
      - 'config/extended/phase2_original_47_country_sample_lock.json'
      - '.github/workflows/42-phase2-wdi-joint-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-intersections:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook reader
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Verify original source and fetch unchanged WDI pilot indicators in Phase B only
        run: python src/python/extended/pilot_wdi_coverage.py
      - name: Test 31 exact intersections, country/year missingness and 3-lag sample screens (no GMM)
        run: python src/python/extended/audit_joint_coverage.py
      - name: Show matched-sample counts
        run: |
          cat outputs/extended/wdi_pilot_2026_10_16/joint_coverage_31_combinations.csv
          echo "No model fitted. Professor original workbook and branch untouched."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-joint-wdi-coverage-31-combinations-original-sample-unchanged
          path: outputs/extended/wdi_pilot_2026_10_16/
          if-no-files-found: warn
          retention-days: 30
