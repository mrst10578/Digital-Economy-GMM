name: Phase 2 Comtrade 9 missing OECD countries 18-year HS85 China import pilot
on:
  push:
    branches:
      - research/digital-economy-extended-data
    paths:
      - 'src/python/extended/pilot_comtrade_nine_18years_hs85_china.py'
      - '.github/workflows/48-phase2-comtrade-nine-full-years-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historic-nine-country-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ISO3 to M49 mapping
        run: python -m pip install 'pycountry>=23,<27'
      - name: Check 2005-2022 availability of reporter-from-China electrical imports with no key and no Stata
        run: python src/python/extended/pilot_comtrade_nine_18years_hs85_china.py
      - name: Display source-specific sample coverage
        if: success()
        run: cat outputs/extended/comtrade_historical_nine_reporters_china_hs85/reporter_coverage.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-COMTRADE-9-COUNTRY-HS85-CHINA-2005-2022-PILOT-NONCAUSAL
          path: outputs/extended/comtrade_historical_nine_reporters_china_hs85/
          if-no-files-found: warn
          retention-days: 30
