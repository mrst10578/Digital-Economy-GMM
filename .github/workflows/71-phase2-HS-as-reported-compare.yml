name: Phase 2 test HS as reported path for authenticated and public ICT goods
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - '.github/workflows/71-phase2-HS-as-reported-compare.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  safe-comtrade-hs-source-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test four HS-as-reported full and preview requests with credential kept solely in HTTP header
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          set -eu
          if test -z "$COMTRADE_API_KEY"; then echo "No configured Comtrade secret"; exit 2; fi
          python src/python/extended/compare_comtrade_preview_vs_full.py
      - name: Archive independently reproducible response evidence
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/extended/COMTRADE_HS_AS_REPORTED_FULL_VS_PREVIEW_DIAG_2026-10-17.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): compare Comtrade HS as reported against direct H4/H6 server failures"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
