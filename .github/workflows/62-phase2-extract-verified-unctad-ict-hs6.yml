name: Phase 2 extract independently SHA-verified official UNCTAD ICT HS6 codes
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - 'src/python/extended/extract_unctad_ict_hs6_official_pdfs.py'
      - '.github/workflows/62-phase2-extract-verified-unctad-ict-hs6.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-only-verified-edition-catalogs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pymupdf>=1.24,<2'
      - uses: actions/download-artifact@v4
        with:
          name: PHASE2-official-UNCTAD-Eurostat-original-HS6-assets
          run-id: 39020521332
          repository: mrst10578/Digital-Economy-GMM
          github-token: ${{ github.token }}
          path: outputs/extended/official_ict_hs6_probe
      - name: Extract and strictly count exactly the official source PDF HS6 records
        run: python src/python/extended/extract_unctad_ict_hs6_official_pdfs.py
      - name: Archive original-URL-labeled HS6 records without claiming harmonization
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extended/official_ict_hs6/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): source-verifiable UNCTAD HS6 ICT edition catalogs with mismatch flag"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-official-UNCTAD-edition-specific-ICT-HS6-catalogs
          path: data/extended/official_ict_hs6/
          if-no-files-found: warn
          retention-days: 30
