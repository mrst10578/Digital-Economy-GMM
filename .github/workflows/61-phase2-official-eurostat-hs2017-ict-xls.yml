name: Phase 2 validate Eurostat official HS2017 ICT annex independently
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - 'src/python/extended/inspect_official_eurostat_ict2017_xls.py'
      - '.github/workflows/61-phase2-official-eurostat-hs2017-ict-xls.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect-eurostat-ict-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'xlrd>=2.0,<3'
      - uses: actions/download-artifact@v4
        with:
          name: PHASE2-official-UNCTAD-Eurostat-original-HS6-assets
          run-id: 39020262375
          repository: mrst10578/Digital-Economy-GMM
          github-token: ${{ github.token }}
          path: outputs/extended/official_ict_hs6_probe
      - name: Examine independently sourced Eurostat ICT2017 Excel annex and source SHA
        run: python src/python/extended/inspect_official_eurostat_ict2017_xls.py
      - name: Persist read-only source layout evidence
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/extended/official_eurostat_hs2017_xls_inspection_2026-10-17.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): audit independent Eurostat ICT2017 Annex code count and source"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
