name: Phase 2 permanently preserve three recipient all-source base-year data
on:
  push:
    branches:
      - research/digital-economy-extended-data
    paths:
      - '.github/workflows/55-phase2-archive-three-multi-origin-countries.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate-and-store-three-receiver-base-years:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read known completed 3-receiver Comtrade artifact without new requests
        uses: actions/download-artifact@v4
        with:
          name: PHASE2-KGZ-MDA-PAN-2005-2007-all-origins-ICT-HS4-weight-feasibility
          run-id: 39017650352
          repository: mrst10578/Digital-Economy-GMM
          github-token: ${{ github.token }}
          path: outputs/extended/artefact_run_39017650352
      - name: Independent full source HASH validation, no missing-value imputation
        run: python src/python/extended/archive_three_recipient_action_evidence.py
      - name: Commit ONLY verified phase B data in the current extended branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extended/comtrade/KGZ_MDA_PAN_2005_2007_*
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): archive verified 773 Comtrade origin records and 138 incomplete base-weight cells"
            git push origin HEAD:research/digital-economy-extended-data
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-THREE-RECIPIENT-BILATERAL-DATA-PERMANENT-CHECK
          path: data/extended/comtrade/KGZ_MDA_PAN_2005_2007_*
          if-no-files-found: warn
          retention-days: 30
