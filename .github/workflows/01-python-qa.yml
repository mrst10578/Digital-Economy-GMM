name: Python scaffold QA
on:
  push:
    paths:
      - ".github/workflows/01-python-qa.yml"
      - "config/**"
      - "src/python/**"
      - "tests/**"
      - "requirements-python.txt"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-python.txt
      - name: Run scaffold unit tests (synthetic fixture only)
        run: python -m pytest -q tests/
      - name: Verify source input state (NOT an estimate)
        run: python -m src.python.preflight --allow-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-scaffold-audit
          path: outputs/preflight_status.json
          if-no-files-found: warn
