name: Validate fresh Stata tablet + live WDI QA evidence
on:
  push:
    branches:
      - research/digital-economy-estimation-audit-20261008
    paths:
      - 'src/python/audit_fresh_stata_20261016.py'
      - 'evidence/tablet-stata-2026-10-16/**'
      - 'evidence/tablet-stata-2026-10-15/production_full_rank_model_status.csv'
      - 'data/raw/Balanced_Panel_Data.xlsx'
      - '.github/workflows/28-fresh-stata-qa.yml'
  pull_request:
    paths:
      - 'src/python/audit_fresh_stata_20261016.py'
      - 'evidence/tablet-stata-2026-10-16/**'
      - 'evidence/tablet-stata-2026-10-15/production_full_rank_model_status.csv'
      - '.github/workflows/28-fresh-stata-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-saved-device-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check saved real Stata and live WDI results (not re-execution)
        run: python -m src.python.audit_fresh_stata_20261016
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-stata-qa-20261016-verification
          path: outputs/fresh_stata_qa/latest.json
          if-no-files-found: warn
