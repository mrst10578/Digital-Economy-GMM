name: Verify professor scientific gates 1 and 2
on:
  push:
    branches:
      - research/digital-economy-estimation-audit-20261008
    paths:
      - 'src/python/audit_professor_exogeneity_stationarity.py'
      - 'stata/tablet_diagnostics/17_professor_exogeneity_relevance_and_unit_root.do'
      - 'evidence/scientific-gates-2026-10-16/**'
      - 'data/raw/Balanced_Panel_Data.xlsx'
      - '.github/workflows/35-professor-exogeneity-stationarity.yml'
  pull_request:
    paths:
      - 'src/python/audit_professor_exogeneity_stationarity.py'
      - 'stata/tablet_diagnostics/17_professor_exogeneity_relevance_and_unit_root.do'
      - 'evidence/scientific-gates-2026-10-16/**'
      - '.github/workflows/35-professor-exogeneity-stationarity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-original-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 64 original R CIPS, 8 actual Stata lag2 checks and 16 actual unit root checks
        run: python -m src.python.audit_professor_exogeneity_stationarity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professor-two-scientific-gates-archived-evidence
          path: outputs/professor_science_gates/latest.json
          if-no-files-found: warn
