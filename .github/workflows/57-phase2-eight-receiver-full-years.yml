name: Phase 2 eight-reporters 2008-2022 public Comtrade partner audit
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - 'src/python/extended/collect_comtrade_eight_2008_2022.py'
      - 'src/python/extended/archive_comtrade_eight_2008_2022_from_artifacts.py'
      - '.github/workflows/57-phase2-eight-receiver-full-years.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: phase2-eight-hs4-extended-data
  cancel-in-progress: false
jobs:
  collect-raw-and-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cohort: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pycountry>=23,<27'
      - name: Validate missingness, duplicate, world, and metadata guards (offline)
        run: python -m unittest discover -s src/python/extended -p 'test_comtrade_oecd_missing_8_preperiod.py' -v
      - name: Fetch true yearly partner records 2008-2022, two HS4 headings; no secret or Stata
        run: python src/python/extended/collect_comtrade_eight_2008_2022.py --cohort ${{ matrix.cohort }}
      - name: Preserve actual source payloads + SHA coverage for independent archival QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHASE2-EIGHT-2008-2022-${{ matrix.cohort }}
          path: outputs/extended/phase2_eight_2008_22/${{ matrix.cohort }}/
          if-no-files-found: warn
          retention-days: 30

  audit-all-and-promote:
    needs: collect-raw-and-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve four independent verified source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PHASE2-EIGHT-2008-2022-*
          path: outputs/extended/phase2_eight_2008_22
          merge-multiple: false
      - name: Re-read 240 raw API responses, SHA, and every partner value; compare to 48 historical base-year slices
        run: python src/python/extended/archive_comtrade_eight_2008_2022_from_artifacts.py
      - name: Archive only 2008-2022 observed-source evidence on independent Phase 2
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extended/comtrade/oecd_missing_hs4_2008_2022/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): archive 2008-2022 eight-reporter audited trade sources, no FTECH"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-EIGHT-2008-2022-validated-source-archive
          path: data/extended/comtrade/oecd_missing_hs4_2008_2022/
          if-no-files-found: warn
          retention-days: 30
