name: Verify native Stata scientific sensitivity evidence
on:
  push:
    branches:
      - research/digital-economy-estimation-audit-20261008
    paths:
      - 'src/python/audit_country_loo.py'
      - 'src/python/audit_gmm_cd.py'
      - 'evidence/tablet-stata-2026-10-16/**'
      - 'data/raw/Balanced_Panel_Data.xlsx'
      - '.github/workflows/29-stata-scientific-diagnostics.yml'
  pull_request:
    paths:
      - 'src/python/audit_country_loo.py'
      - 'src/python/audit_gmm_cd.py'
      - 'evidence/tablet-stata-2026-10-16/**'
      - '.github/workflows/29-stata-scientific-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel reader
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Verify real Stata country jackknife (not run Stata in CI)
        run: python -m src.python.audit_country_loo
      - name: Verify GMM residual dependence outputs (not run Stata in CI)
        run: python -m src.python.audit_gmm_cd
      - name: Upload verification summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmm-scientific-diagnostics-verification
          path: |
            outputs/loo_science/loo_summary.json
            outputs/gmm_cd_audit/latest.json
          if-no-files-found: warn
