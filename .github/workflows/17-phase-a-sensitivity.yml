name: Phase A - predeclared original-panel sensitivity audit
on:
  push:
    paths:
      - "src/python/phase_a_sensitivity.py"
      - ".github/workflows/17-phase-a-sensitivity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install immutable source analysis dependencies
        run: python -m pip install "pandas>=2,<3" "openpyxl>=3,<4" "statsmodels>=0.14,<1" "numpy>=1.26,<3"
      - name: Real deterministic sensitivity analysis from original workbook
        run: python src/python/phase_a_sensitivity.py
      - name: Check positive provenance and minimum expected output
        run: |
          test -s outputs/phase_a/all_prespecified_sensitivity_models.csv
          test -s outputs/phase_a/leave_one_country_out_summary.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-economy-phase-a-audit
          path: outputs/phase_a/
          if-no-files-found: warn
