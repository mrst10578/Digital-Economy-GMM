name: Phase 2 controlled comparison official trade API and preview
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - '.github/workflows/69-phase2-compare-full-and-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test four distinct pairs against official full and preview source
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          test -n "$COMTRADE_API_KEY"
          python src/python/extended/compare_comtrade_preview_vs_full.py
      - name: Archive exact comparison
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/extended/COMTRADE_PREVIEW_VS_FULL_IDENTICAL_HS_CODES_2026-10-17.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): compare same trade records via protected full versus preview API"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
