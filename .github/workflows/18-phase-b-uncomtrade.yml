name: Phase B - real UN Comtrade bilateral trade pilot
on:
  push:
    paths:
      - "src/python/phase_b_uncomtrade_pilot.py"
      - ".github/workflows/18-phase-b-uncomtrade.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comtrade-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook/data dependencies
        run: python -m pip install "pandas>=2,<3" "numpy>=1.26,<3" "openpyxl>=3,<4"
      - name: Fetch actual official HS85 imports by reporter/partner/year (not artificial data)
        run: python src/python/phase_b_uncomtrade_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-economy-phase-b-official-bilateral-pilot
          path: outputs/phase_b_pilot/
          if-no-files-found: warn
