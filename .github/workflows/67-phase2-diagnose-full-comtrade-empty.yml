name: Phase 2 diagnose key-authorized Comtrade empty HS6 response without zero imputation
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - '.github/workflows/67-phase2-diagnose-full-comtrade-empty.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  credential-safe-query-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose six narrowly bounded real Comtrade API queries without exposing subscription key
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          set -eu
          if test -z "$COMTRADE_API_KEY"; then
            echo "Secret not configured. No authenticated API requests made."
            exit 2
          fi
          python src/python/extended/diagnose_comtrade_authenticated_hs6_empty.py
      - name: Commit solely sanitized source response diagnostics
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/extended/COMTRADE_FULL_API_HS6_EMPTY_QUERY_DIAG_2026-10-17.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): audit why full authenticated Comtrade source returned no ICT HS6 rows"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
