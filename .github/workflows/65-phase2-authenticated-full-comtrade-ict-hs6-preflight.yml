name: Phase 2 full official ICT HS6 source-revision-aware classic World preflight
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - '.github/workflows/65-phase2-authenticated-full-comtrade-ict-hs6-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validated-hs6-single-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require officially configured UN Comtrade Free API secret (no hardcoded credentials)
        shell: bash
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          set -eu
          if test -z "$COMTRADE_API_KEY"; then
            echo "COMTRADE_API_KEY GitHub repository secret is not configured. No API request executed." >&2
            exit 2
          fi
          python src/python/extended/preflight_free_comtrade_full_ict_hs6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-authenticated-8-HS6-goods-source-verified-classic-2017
          path: outputs/extended/official_comtrade_full_api_preflight/
          if-no-files-found: warn
          retention-days: 30
