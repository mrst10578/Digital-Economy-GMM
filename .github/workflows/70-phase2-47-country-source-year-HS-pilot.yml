name: Phase 2 pilot official 47-country actual HS classification editions
on:
  push:
    branches: [research/digital-economy-extended-data]
    paths:
      - '.github/workflows/70-phase2-47-country-source-year-HS-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-edition-not-inferred-from-year:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/digital-economy-extended-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pycountry>=24,<30'
      - name: Query actual annual Comtrade data availability for 47 original-country sources
        run: python src/python/extended/pilot_47_original_countries_source_HS_years.py
      - name: Preserve pilot values and independent provenance
        run: |
          set -eu
          mkdir -p data/extended/comtrade/source_hs_revisions_47
          cp outputs/extended/source_47_edition_pilot/47_country_three_year_reporter_edition_pilot.csv data/extended/comtrade/source_hs_revisions_47/
          cp outputs/extended/source_47_edition_pilot/COVERAGE_AND_PROVENANCE.json data/extended/comtrade/source_hs_revisions_47/pilot_2005_2017_2022_provenance.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extended/comtrade/source_hs_revisions_47/
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): audit 47 original reporters' genuine HS editions in 2005, 2017, 2022"
            git pull --rebase origin research/digital-economy-extended-data
            git push origin HEAD:research/digital-economy-extended-data
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHASE2-47-country-official-GETDA-3-year-source-pilot
          path: outputs/extended/source_47_edition_pilot/
          if-no-files-found: warn
          retention-days: 30
